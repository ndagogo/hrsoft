<form method="post">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-12">
      <label class="form-label small fw-semibold">Leave type</label>
      {{ form.leave_type }}
    </div>
    <div class="col-md-6">
      <label class="form-label small fw-semibold">Start date</label>
      {{ form.start_date }}
    </div>
    <div class="col-md-6">
      <label class="form-label small fw-semibold">End date</label>
      {{ form.end_date }}
    </div>
    <div class="col-md-12">
      <label class="form-label small fw-semibold">Stand-in colleague <span class="text-secondary">(same department)</span></label>
      {{ form.stand_in_employee }}
      <div class="form-text">They must accept before your leave goes to HOD → HR → GM.</div>
    </div>
    <div class="col-md-12">
      <label class="form-label small fw-semibold">Reason</label>
      {{ form.reason }}
    </div>
    <div class="col-md-12">
      <label class="form-label small fw-semibold">Handover notes <span class="text-secondary">(optional)</span></label>
      {{ form.handover_notes }}
    </div>
    {% for e in form.non_field_errors %}<div class="col-12 text-danger small">{{ e }}</div>{% endfor %}
  </div>
  <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-amber">Submit request</button>
  </div>
</form>
