<div class="surface-card h-100">
  <div class="surface-card-header">
    <h3 class="surface-card-title">{{ title|default:"Calendar" }}</h3>
  </div>
  <div class="surface-card-body">
    <div id="{{ calendar_id|default:'dashboardCalendar' }}" style="min-height:320px;"></div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const el = document.getElementById("{{ calendar_id|default:'dashboardCalendar' }}");
  if (!el || typeof FullCalendar === "undefined") return;
  const cal = new FullCalendar.Calendar(el, {
    initialView: "dayGridMonth",
    height: 320,
    headerToolbar: { left: "prev,next", center: "title", right: "dayGridMonth,listWeek" },
    events: "{% url 'dashboard:calendar_events' %}?scope={{ scope|default:'personal' }}",
    eventDisplay: "block",
  });
  cal.render();
});
</script>
