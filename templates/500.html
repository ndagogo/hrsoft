{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong · {{ COMPANY_NAME|default:"HRMS" }}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/hrms.css' %}">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink-50);">
  <div class="text-center px-3" style="max-width:480px;">
    <div class="sidebar-brand-mark mx-auto mb-3">HR</div>
    <p class="text-secondary mb-1" style="letter-spacing:0.08em;font-size:0.75rem;text-transform:uppercase;">Error 500</p>
    <h1 class="font-display fw-semibold mb-2">Something went wrong</h1>
    <p class="text-secondary mb-4">An unexpected error occurred. Please try again shortly. If the problem continues, contact your system administrator.</p>
    <a href="/" class="btn btn-primary">Back to dashboard</a>
  </div>
</body>
</html>
