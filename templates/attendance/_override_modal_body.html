<form method="post" action="{% url 'attendance:override' record.pk %}">
  {% csrf_token %}
  <p class="text-secondary" style="font-size:0.85rem;">
    Manually adjusting <strong>{{ record.employee.full_name }}</strong>'s record for <strong>{{ record.date|date:"M d, Y" }}</strong>.
    Use this when biometric data is missing (e.g. device offline) or incorrect.
  </p>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label small fw-semibold">Check in</label>
      {{ form.check_in }}
    </div>
    <div class="col-md-6">
      <label class="form-label small fw-semibold">Check out</label>
      {{ form.check_out }}
    </div>
    <div class="col-md-6">
      <label class="form-label small fw-semibold">Status</label>
      {{ form.status }}
    </div>
    <div class="col-md-12">
      <label class="form-label small fw-semibold">Notes</label>
      {{ form.notes }}
    </div>
  </div>
  <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-amber">Save override</button>
  </div>
</form>
