{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Two-Factor Authentication</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/hrms.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--ink-950);">
<div class="surface-card p-4" style="max-width:380px;width:100%;">
  <h2 class="font-display fw-semibold mb-1">Two-factor authentication</h2>
  <p class="section-subtext mb-4">Enter the 6-digit code from your authenticator app.</p>
  <form method="post">{% csrf_token %}
    <input type="text" name="token" class="form-control form-control-lg text-center mb-3" maxlength="6" pattern="[0-9]{6}" placeholder="000000" autofocus required>
    <button type="submit" class="btn btn-amber w-100">Verify</button>
  </form>
</div>
</body>
</html>
