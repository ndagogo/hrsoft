{% extends "base.html" %}
{% block title %}Loan Request{% endblock %}
{% block page_title %}Request a loan{% endblock %}
{% block content %}
<div class="surface-card mx-auto" style="max-width:560px;"><div class="surface-card-body">
<form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button type="submit" class="btn btn-amber">Submit</button><a href="{% url 'selfservice:hub' %}" class="btn btn-light">Cancel</a></form></div></div>
{% endblock %}
