{% extends "base.html" %}
{% block title %}Profile Update Request{% endblock %}
{% block page_title %}Request profile update{% endblock %}
{% block content %}
<div class="surface-card mx-auto" style="max-width:560px;"><div class="surface-card-body">
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
  <button type="submit" class="btn btn-amber">Submit request</button>
  <a href="{% url 'selfservice:hub' %}" class="btn btn-light">Cancel</a>
</form></div></div>
{% endblock %}
