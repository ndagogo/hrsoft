{% extends "base.html" %}
{% block title %}Request Asset{% endblock %}
{% block page_title %}Request Asset{% endblock %}
{% block content %}
<div class="surface-card surface-card-body" style="max-width:560px;">
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label small fw-semibold">{{ field.label }}</label>{{ field }}</div>{% endfor %}
    <button type="submit" class="btn btn-primary">Submit Request</button>
  </form>
</div>
{% endblock %}
