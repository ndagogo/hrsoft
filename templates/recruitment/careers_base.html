<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Careers{% endblock %} · Health Focus Diagnostics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --ink:#0f2744; --teal:#0d9488; --sand:#f3f6f9; }
    body { background: linear-gradient(165deg, #e8f0f5 0%, #f8fafc 40%, #eef6f4 100%); min-height:100vh; color:var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    .careers-nav { background: rgba(15,39,68,.92); backdrop-filter: blur(8px); }
    .careers-nav a { color:#fff; text-decoration:none; }
    .careers-hero { padding: 3rem 0 2rem; }
    .careers-hero h1 { font-weight:700; letter-spacing:-.02em; }
    .role-card { background:#fff; border:1px solid rgba(15,39,68,.08); border-radius:12px; padding:1.25rem 1.5rem; transition: box-shadow .2s, transform .2s; height:100%; }
    .role-card:hover { box-shadow:0 12px 28px rgba(15,39,68,.1); transform:translateY(-2px); }
    .btn-apply { background:var(--teal); border:none; color:#fff; }
    .btn-apply:hover { background:#0f766e; color:#fff; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="careers-nav py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="{% url 'recruitment:careers' %}" class="fw-semibold"><i class="bi bi-heart-pulse me-2"></i>Health Focus Diagnostics — Careers</a>
    </div>
  </nav>
  <main class="container pb-5">
    {% if messages %}
    <div class="pt-3">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
